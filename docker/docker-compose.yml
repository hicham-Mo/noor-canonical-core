version: '3.8'\n\nservices:\n  app:\n    build:\n      context: ..\n      dockerfile: docker/Dockerfile\n    ports:\n      - \"8000:8000\"\n    environment:\n      - APP_ENV=development\n      - DEBUG=true\n      - DATABASE_URL=sqlite:///./noor.db\n      - CLOUD_PROVIDER=local\n    volumes:\n      - ../app:/app/app\n      - ../tests:/app/tests\n    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload\n    healthcheck:\n      test: [\"CMD\", \"curl\", \"-f\", \"http://localhost:8000/health\"]\n      interval: 30s\n      timeout: 10s\n      retries: 3\n      start_period: 10s\n\n  postgres:\n    image: postgres:15-alpine\n    environment:\n      - POSTGRES_DB=noor\n      - POSTGRES_USER=noor_user\n      - POSTGRES_PASSWORD=noor_password\n    ports:\n      - \"5432:5432\"\n    volumes:\n      - postgres_data:/var/lib/postgresql/data\n    healthcheck:\n      test: [\"CMD-SHELL\", \"pg_isready -U noor_user -d noor\"]\n      interval: 10s\n      timeout: 5s\n      retries: 5\n\nvolumes:\n  postgres_data:\n"